[package]
name = "speculative-ann"
version = "0.1.0"
edition = "2021"
description = "Rust PoC for speculative ANN search: int8 draft index + f32 verification"

[dependencies]
rand = { version = "0.8", features = ["small_rng"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "spec_bench"
harness = false

[[example]]
name = "demo"
